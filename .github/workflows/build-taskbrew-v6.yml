name: Compilar Task Brew V6 APK

on:
  push:
    branches: [task-brew-apk]
    paths:
      - 'taskbrew-v6-build/**'
      - '.github/workflows/build-taskbrew-v6.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Descargar rama
        uses: actions/checkout@v4

      - name: Restaurar proyecto Task Brew V6
        run: |
          mkdir -p taskbrew-v6-work
          cat taskbrew-v6-build/chunk.00 \
              taskbrew-v6-build/chunk.01a0 \
              taskbrew-v6-build/chunk.01a1 \
              taskbrew-v6-build/a2.p0 \
              taskbrew-v6-build/a2.p1 \
              taskbrew-v6-build/a2.p2 \
              taskbrew-v6-build/a2.p3q0 \
              taskbrew-v6-build/a2.p3q1 \
              taskbrew-v6-build/a2.p3q2 \
              taskbrew-v6-build/a2.p3q3 \
              taskbrew-v6-build/a2.p3q4 \
              taskbrew-v6-build/a2.p4 \
              taskbrew-v6-build/chunk.01b \
              taskbrew-v6-build/chunk.02 \
              taskbrew-v6-build/chunk.03 \
              taskbrew-v6-build/chunk.04 \
              | base64 -d > taskbrew-v6-work/source.tar.xz
          xz -t taskbrew-v6-work/source.tar.xz
          tar -xJf taskbrew-v6-work/source.tar.xz -C taskbrew-v6-work
          test -f taskbrew-v6-work/TaskBrewV6AndroidTiny/settings.gradle

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK y Build Tools
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK debug firmado
        working-directory: taskbrew-v6-work/TaskBrewV6AndroidTiny
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon > build.log 2>&1
          STATUS=$?
          cat build.log
          exit $STATUS

      - name: Guardar log de compilacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Task-Brew-V6-Build-Log
          path: taskbrew-v6-work/TaskBrewV6AndroidTiny/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verificar firma APK
        if: success()
        run: |
          APK="taskbrew-v6-work/TaskBrewV6AndroidTiny/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" Task_Brew_V6.apk
          ls -lh Task_Brew_V6.apk

      - name: Guardar Task Brew V6 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Task-Brew-V6-APK
          path: Task_Brew_V6.apk
          if-no-files-found: error
          retention-days: 30
