name: Compilar Mi Plan Diario

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mi-plan-diario-android-source/**'
      - '.github/workflows/build-mi-plan-diario.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Reconstruir proyecto Android
        run: |
          set -euo pipefail
          mkdir -p /tmp/mi-plan-build
          cat mi-plan-diario-android-source/source.chunk.* \
            | LC_ALL=C tr -cd 'A-Za-z0-9+/=' \
            > /tmp/mi-plan-build/source.b64
          base64 --decode /tmp/mi-plan-build/source.b64 \
            > /tmp/mi-plan-build/source.tar.gz
          echo '3fad47b6ccd54442bf5e95abaccbd78766ed6583ef88730ca809ffb56571c394  /tmp/mi-plan-build/source.tar.gz' \
            | sha256sum --check
          tar -xzf /tmp/mi-plan-build/source.tar.gz
          test -f mi-plan-diario-android/settings.gradle.kts
          test -f mi-plan-diario-android/app/build.gradle.kts

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK requerido
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compilar APK
        id: compile
        working-directory: mi-plan-diario-android
        run: |
          set +e
          gradle --no-daemon clean assembleDebug 2>&1 | tee /tmp/mi-plan-build/gradle.log
          result=${PIPESTATUS[0]}
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validar y preparar resultado
        run: |
          set -euo pipefail
          rm -rf dist/mi-plan-diario
          mkdir -p dist/mi-plan-diario
          cp /tmp/mi-plan-build/gradle.log dist/mi-plan-diario/gradle.log

          if [ '${{ steps.compile.outputs.exit_code }}' = '0' ]; then
            APK='mi-plan-diario-android/app/build/outputs/apk/debug/app-debug.apk'
            test -s "$APK"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" \
              | tee dist/mi-plan-diario/apksigner.txt
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" \
              | tee dist/mi-plan-diario/badging.txt
            cp "$APK" dist/mi-plan-diario/Mi-Plan-Diario-v3.2-instalable.apk
            sha256sum dist/mi-plan-diario/Mi-Plan-Diario-v3.2-instalable.apk \
              | tee dist/mi-plan-diario/Mi-Plan-Diario-v3.2-instalable.sha256
            printf 'SUCCESS\n' > dist/mi-plan-diario/build-status.txt
          else
            printf 'FAILURE: Gradle exit code %s\n' '${{ steps.compile.outputs.exit_code }}' \
              > dist/mi-plan-diario/build-status.txt
          fi

      - name: Publicar APK y diagnóstico en el repositorio
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/mi-plan-diario
          git commit -m 'Publicar compilación verificada de Mi Plan Diario' || true
          git push

      - name: Publicar artefacto de Actions
        if: steps.compile.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Plan-Diario-v3.2-instalable
          path: |
            dist/mi-plan-diario/Mi-Plan-Diario-v3.2-instalable.apk
            dist/mi-plan-diario/Mi-Plan-Diario-v3.2-instalable.sha256
            dist/mi-plan-diario/apksigner.txt
            dist/mi-plan-diario/badging.txt
          if-no-files-found: error
          retention-days: 30

      - name: Marcar fallo de compilación
        if: steps.compile.outputs.exit_code != '0'
        run: exit 1
